# Worker V2 — INDÉPENDANT de la V1 (worker.js / wrangler.toml restent intacts).
# Déploiement : wrangler deploy -c wrangler-v2.toml
#
# Réutilise les mêmes secrets/clés que la V1 (EODHD_API_KEY, TWELVE_KEY_*,
# SUPABASE_URL, SUPABASE_ANON_KEY, ADMIN_API_TOKEN, ADMIN_PIN, ALLOWED_ORIGINS).
# Le binding KV peut être partagé : les clés V2 sont préfixées `v2:`.
name = "manitradepro-v2"
main = "worker-v2.js"
compatibility_date = "2026-03-29"
account_id = "a44ec708d7642c774dc1f8c63f653c6b"
workers_dev = true

kv_namespaces = [
  { binding = "MTP_CACHE", id = "17eb7ddc41a949dd99bd840142832cfd" }
]

# Front V2 servi directement par le Worker (Workers Static Assets).
# https://manitradepro-v2.<sous-domaine>.workers.dev/ → v2/index.html
# Les routes /api/v2/* ne matchent aucun fichier → passent au Worker.
[assets]
directory = "../v2"

[triggers]
# Un cycle complet toutes les heures (bougies daily : pas besoin de plus).
crons = [
  "0 * * * *"
]
