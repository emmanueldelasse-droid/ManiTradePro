name: Deploy V2 paper worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/worker-v2.js'
      - 'cloudflare-worker/paper-*.mjs'
      - 'cloudflare-worker/wrangler-v2.toml'
      - 'tools/v2/lib/**'
      - '.github/workflows/deploy-paper-v2.yml'

permissions:
  contents: read

concurrency:
  group: deploy-manitradepro-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test paper engine and journal
        run: npm run test:v2
      - name: Publish the V2 simulation
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3.114.17 deploy -c wrangler-v2.toml
