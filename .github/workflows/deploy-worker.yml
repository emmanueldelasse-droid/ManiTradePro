name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy manitradepro worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug — token presence (NE PAS afficher la valeur)
        env:
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          TOKEN_LEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && '>=1' || '0' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN défini : $TOKEN_SET"
          echo "Longueur approximative : $TOKEN_LEN"

      # B.11.2 fix — l'action cloudflare/wrangler-action@v3 swallow stdout/
      # stderr de wrangler, donc on bypass et on lance wrangler directement
      # via `run:` pour capturer la VRAIE erreur dans le log GitHub Actions.
      - name: Install wrangler globally
        run: npm install -g wrangler@^3

      - name: Wrangler whoami (diagnostic auth, never fails the job)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== Wrangler version ==="
          wrangler --version
          echo ""
          echo "=== whoami ==="
          wrangler whoami || echo "whoami exit=$?"

      - name: Wrangler deploy (full stdout/stderr)
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG: debug
        run: |
          echo "=== Deploy attempt with debug logging ==="
          wrangler deploy 2>&1
