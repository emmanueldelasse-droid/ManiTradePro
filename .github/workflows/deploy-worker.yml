name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy manitradepro worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug — token presence (NE PAS afficher la valeur)
        env:
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          TOKEN_LEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && '>=1' || '0' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN défini : $TOKEN_SET"
          echo "Longueur approximative : $TOKEN_LEN"

      # B.11.2 — diagnostic auth + droits du token. Le workflow a échoué
      # silencieusement plusieurs fois sans qu'on sache pourquoi. whoami
      # affiche l'account et les permissions effectives du token.
      - name: Wrangler whoami (diagnostic auth)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare-worker
          command: whoami

      - name: Deploy via Wrangler (log debug)
        uses: cloudflare/wrangler-action@v3
        env:
          WRANGLER_LOG: debug
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare-worker
          command: deploy
